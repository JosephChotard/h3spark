name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs needs the tags to derive the version
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # h3spark is pure Python, so a single py3-none-any wheel plus an sdist covers every platform
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check built version matches tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          wheel=$(basename dist/*.whl)
          version=$(echo "$wheel" | cut -d- -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Built version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Smoke test wheel
        run: |
          set -e
          python -m venv .venv
          source .venv/bin/activate
          pip install dist/*.whl
          cd /tmp && python -c "import h3spark, h3spark.native, h3spark.convenience"
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [tests, build]
    environment: pypi
    permissions:
      # Used for PyPI trusted publishing and to sign the release artifacts
      id-token: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
