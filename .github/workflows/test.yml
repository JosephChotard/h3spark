# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pyspark: "3.5.*", python: "3.11", remote: "0" }
          - { pyspark: "4.*", python: "3.13", remote: "0" }
          # Through a local Spark Connect server
          - { pyspark: "4.*", python: "3.13", remote: "1" }
    name: pyspark ${{ matrix.pyspark }}${{ matrix.remote == '1' && ' (Spark Connect)' || '' }}

    steps:
    - uses: actions/checkout@v7
      with:
        # hatch-vcs needs the tags to derive the version
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Set up Java 17 for Spark
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black==26.10.1 flake8 pytest
        pip install -e . "pyspark[sql,connect]==${{ matrix.pyspark }}"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --statistics
    - name: Lint with black
      run: |
        black --check --diff .
    - name: Test with pytest
      env:
        H3SPARK_TEST_REMOTE: ${{ matrix.remote }}
      run: |
        pytest
